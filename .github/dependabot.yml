version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Tailwind 4 needs a PostCSS plugin package and a config migration.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
    groups:
      electron-forge:
        patterns: ['@electron-forge/*', '@electron/*']
      azure-sdk:
        patterns: ['@azure/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
